function currentExerciseData(){if(!state.exercise)return null;const [mod,kind]=state.exercise.split(':');const m=moduleById(mod);if(!m)return null;let title,desc,rounds,type;if(kind==='q1'){title='Diagnostic';desc='Choisis le mouvement commercial adapté à ce qui est connu dans le scénario.';rounds=DATA.quizzes[mod].slice(0,6);type='choice'}else if(kind==='q2'){title='Techniques';desc='Identifie la méthode, la structure ou la prochaine action pertinente.';rounds=DATA.quizzes[mod].slice(6,12);type='choice'}else if(kind==='p1'){title='Production écrite';desc='Produis une réponse complète, puis compare-la au modèle et évalue-la avec la grille.';rounds=DATA.practice[mod].slice(0,6);type='practice'}else{title='Sprint oral';desc='Réponds à voix haute. Tu peux enregistrer ta prise dans le navigateur, puis l’écouter et t’auto-évaluer.';rounds=DATA.practice[mod].slice(6,12);type='oral'}return {mod,kind,m,title,desc,rounds,type}}
function renderExerciseRun(){const ex=currentExerciseData();if(!ex){navigate('exercises');return}const i=state.round,round=ex.rounds[i],total=ex.rounds.length;const key=ex.mod+'_'+ex.kind+'_'+i;const answer=state.answers[key]??state.stateData.practiceAnswers[key]??'';const done=!!state.stateData.exerciseDone[exerciseKey(ex.mod,ex.kind)];let body='';
 if(ex.type==='choice'){
  let options=[{text:round.correct,correct:true},...round.wrong.map(t=>({text:t,correct:false}))];let seed=(i*7+ex.mod.length*5+(ex.kind==='q2'?3:0))%options.length;options=options.slice(seed).concat(options.slice(0,seed));const picked=state.answers[key+'_picked'];body=`<div class="option-list">${options.map((o,j)=>`<button class="option ${picked!==undefined&&o.correct?'correct':''} ${picked===j&&!o.correct?'incorrect':''}" data-option="${j}" ${picked!==undefined?'disabled':''}><span class="option-letter">${String.fromCharCode(65+j)}</span><span>${esc(o.text)}</span></button>`).join('')}</div>${picked!==undefined?`<div class="feedback"><strong>${options[picked]?.correct?'Réponse correcte':'À revoir'}</strong>${esc(round.feedback)}</div>`:''}`;
 } else {
  const checklist=round.checks||[];const modelShown=!!state.shownModels[key];const checksState=state.answers[key+'_checks']||[];
  body=`<div class="answer-area"><textarea id="practiceAnswer" placeholder="Rédige ou prépare ta réponse avant de consulter le modèle…">${esc(answer)}</textarea>${ex.type==='oral'?`<div class="record-panel"><button class="btn soft" id="recordStart">● Enregistrer</button><button class="btn soft hidden" id="recordStop">Arrêter</button><button class="btn soft hidden" id="recordReplay">Écouter</button><span class="record-status" id="recordStatus">Enregistrement local facultatif</span><span>La prise n’est pas envoyée.</span></div>`:''}<div class="actions"><button class="btn soft" data-show-model>${modelShown?'Modèle affiché ✓':'Afficher un modèle de réponse'}</button><button class="btn primary" data-save-practice>Enregistrer ma réponse</button></div>${modelShown?`<div class="model-answer"><strong>Réponse de référence</strong>${esc(round.model)}</div>`:''}<div><div class="section-title"><h2>Grille d’auto-évaluation</h2><span>Coche les critères présents dans ta réponse</span></div><div class="selfcheck">${checklist.map((c,j)=>`<label class="check-row"><input type="checkbox" data-check-index="${j}" ${checksState.includes(j)?'checked':''}><span>${esc(c)}</span></label>`).join('')}</div></div></div>`;
 }
 document.getElementById('page-exercise-run').innerHTML=`<div class="exercise-wrap"><div class="reader-nav"><button class="btn soft" data-go="exercises">← Bibliothèque</button><span>${esc(ex.m.name)} · ${esc(ex.title)}</span></div><div class="exercise-head glass"><div class="eyebrow">${ex.type==='choice'?'QCM corrigé':ex.type==='oral'?'Sprint oral':'Atelier de production'}</div><h1>${esc(ex.title)} · ${esc(ex.m.name)}</h1><p>${esc(ex.desc)}</p><div class="exercise-meta"><span class="pill">Situation ${i+1} sur ${total}</span><span class="pill mint">${esc(ex.m.name)}</span><span class="pill">${done?'Déjà terminé · rejouable':'Progression sauvegardée'}</span></div></div><div class="exercise-content glass"><div class="round-progress">${ex.rounds.map((_,j)=>`<i class="${j<i?'done':''}"></i>`).join('')}</div><div class="round-label">SITUATION ${String(i+1).padStart(2,'0')}</div><div class="scenario">${esc(round.scenario)}</div><div class="question">${esc(round.prompt)}</div>${body}<div class="exercise-actions"><button class="btn soft" data-round-prev ${i===0?'disabled':''}>← Précédent</button><span class="muted">${i+1}/${total}</span><button class="btn primary" data-round-next>${i===total-1?'Terminer la série':'Situation suivante →'}</button></div></div></div>`;
 bindRecordButtons(ex, key);
}
function renderProgress(){const lessons=doneLessonCount(),exdone=doneExerciseCount(),pct=Math.round((lessons+exdone)/(totalLessons()+totalExercises())*100);document.getElementById('page-progress').innerHTML=head('Progression','Le travail réalisé','Suivi local des chapitres lus et des séries terminées. Les réponses libres sont auto-évaluées.')+`<div class="progress-top"><div class="progress-stat glass"><span>Progression globale</span><strong>${pct}%</strong><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div></div><div class="progress-stat glass"><span>Chapitres terminés</span><strong>${lessons}<small style="font-size:12px;color:#98a6b5"> / ${totalLessons()}</small></strong><div class="progress-track"><div class="progress-fill" style="width:${lessons/totalLessons()*100}%"></div></div></div><div class="progress-stat glass"><span>Séries d’exercices terminées</span><strong>${exdone}<small style="font-size:12px;color:#98a6b5"> / ${totalExercises()}</small></strong><div class="progress-track"><div class="progress-fill" style="width:${exdone/totalExercises()*100}%"></div></div></div></div>${DATA.modules.map(m=>{let l=m.lessons.filter((x,i)=>isLessonDone(m.id,i)).length;let e=['q1','q2','p1','p2'].filter(k=>isExerciseDone(m.id,k)).length;let p=Math.round((l+e)/(m.lessons.length+4)*100);return `<div class="progress-theme glass"><div><h3>${esc(m.name)}</h3><p>${l}/${m.lessons.length} chapitres · ${e}/4 séries</p></div><div class="progress-track"><div class="progress-fill" style="width:${p}%"></div></div><div class="pct">${p}%</div></div>`}).join('')}<div style="margin-top:20px"><button class="btn soft" id="resetProgress">Réinitialiser toute ma progression</button></div>`}
function getRoundKey(ex, idx=state.round){return ex.mod+'_'+ex.kind+'_'+idx}
function getRoundOptions(ex, round, idx){let options=[{text:round.correct,correct:true},...round.wrong.map(t=>({text:t,correct:false}))];let seed=(idx*7+ex.mod.length*5+(ex.kind==='q2'?3:0))%options.length;return options.slice(seed).concat(options.slice(0,seed))}
function bindRecordButtons(ex,key){if(ex.type!=='oral')return;const start=document.getElementById('recordStart'),stop=document.getElementById('recordStop'),replay=document.getElementById('recordReplay'),status=document.getElementById('recordStatus');if(!start)return;
 start.onclick=async()=>{try{if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){status.textContent='Enregistrement non pris en charge par ce navigateur';return}const stream=await navigator.mediaDevices.getUserMedia({audio:true});state.recordChunks=[];state.recorder=new MediaRecorder(stream);state.recorder.ondataavailable=e=>{if(e.data&&e.data.size)state.recordChunks.push(e.data)};state.recorder.onstop=()=>{const blob=new Blob(state.recordChunks,{type:state.recorder?.mimeType||'audio/webm'});if(state.recordUrl)URL.revokeObjectURL(state.recordUrl);state.recordUrl=URL.createObjectURL(blob);state.answers[key+'_recorded']=true;state.answers[key+'_audioUrl']=state.recordUrl;stream.getTracks().forEach(t=>t.stop());status.textContent='Prise enregistrée dans cette session';replay.classList.remove('hidden');stop.classList.add('hidden');start.classList.remove('hidden');};state.recorder.start();start.classList.add('hidden');stop.classList.remove('hidden');status.textContent='Enregistrement en cours…';}catch(e){status.textContent='Microphone indisponible ou autorisation refusée';}};
 stop.onclick=()=>{if(state.recorder&&state.recorder.state!=='inactive')state.recorder.stop()};replay.onclick=()=>{if(state.recordUrl){const a=new Audio(state.recordUrl);a.play().catch(()=>status.textContent='Lecture impossible')}};
}
function canAdvance(ex){const key=getRoundKey(ex);if(ex.type==='choice')return state.answers[key+'_picked']!==undefined;if(ex.type==='practice')return !!(state.stateData.practiceAnswers[key]||'').trim();return !!((state.stateData.practiceAnswers[key]||'').trim()||state.answers[key+'_recorded'])}
document.addEventListener('click',e=>{
 const el=e.target.closest('button,article');if(!el)return;
 if(el.dataset.go){state.selectedTheme='all';state.search='';navigate(el.dataset.go);return}
 if(el.dataset.page){navigate(el.dataset.page);return}
 if(el.dataset.themeAction){state.selectedTheme=el.dataset.theme;state.search='';navigate(el.dataset.themeAction);return}
 if(el.dataset.moduleFilter!==undefined){state.selectedTheme=el.dataset.moduleFilter;renderModules();return}
 if(el.dataset.exerciseFilter!==undefined){state.selectedTheme=el.dataset.exerciseFilter;renderExercises();return}
 if(el.dataset.openModule){state.activeModule=el.dataset.openModule;state.lessonIndex=0;navigate('reader');return}
 if(el.dataset.lessonIndex!==undefined){state.lessonIndex=Number(el.dataset.lessonIndex);renderReader();return}
 if(el.hasAttribute('data-mark-lesson')){state.stateData.lessons[lessonKey(state.activeModule,state.lessonIndex)]=true;saveProgress();renderReader();notify('Chapitre enregistré comme lu');return}
 if(el.hasAttribute('data-lesson-prev')){if(state.lessonIndex>0){state.lessonIndex--;renderReader()}return}
 if(el.hasAttribute('data-lesson-next')){const m=moduleById(state.activeModule);if(state.lessonIndex<m.lessons.length-1){state.lessonIndex++;renderReader()}else{navigate('modules');notify('Fin du module')}return}
 if(el.dataset.startExercise){state.exercise=el.dataset.startExercise;state.round=0;state.answers={};state.shownModels={};state.recordUrl=null;navigate('exercise-run');return}
 if(el.dataset.option!==undefined){const ex=currentExerciseData(),round=ex.rounds[state.round],opts=getRoundOptions(ex,round,state.round),key=getRoundKey(ex),idx=Number(el.dataset.option);state.answers[key+'_picked']=idx;state.stateData.quizScores[key]=!!opts[idx]?.correct;saveProgress();renderExerciseRun();return}
 if(el.hasAttribute('data-show-model')){const ex=currentExerciseData(),key=getRoundKey(ex);state.shownModels[key]=true;renderExerciseRun();return}
 if(el.hasAttribute('data-save-practice')){const ex=currentExerciseData(),key=getRoundKey(ex),ta=document.getElementById('practiceAnswer');state.stateData.practiceAnswers[key]=ta?.value||'';state.answers[key]=ta?.value||'';const checks=[...document.querySelectorAll('[data-check-index]')].filter(c=>c.checked).map(c=>Number(c.dataset.checkIndex));state.answers[key+'_checks']=checks;saveProgress();renderExerciseRun();notify('Réponse et auto-évaluation enregistrées');return}
 if(el.hasAttribute('data-round-prev')){if(state.round>0){state.round--;renderExerciseRun()}return}
 if(el.hasAttribute('data-round-next')){const ex=currentExerciseData();if(!canAdvance(ex)){notify(ex.type==='choice'?'Choisis une réponse avant de continuer.':'Enregistre ta réponse ou termine ta prise avant de continuer.');return}if(state.round<ex.rounds.length-1){state.round++;renderExerciseRun();return}state.stateData.exerciseDone[exerciseKey(ex.mod,ex.kind)]=true;saveProgress();stopCurrentRecorder();state.exercise=null;navigate('exercises');notify('Série terminée, progression enregistrée');return}
 if(el.id==='recordStart'||el.id==='recordStop'||el.id==='recordReplay')return;
 if(el.id==='resetProgress'){if(confirm('Réinitialiser les chapitres et séries terminés sur ce navigateur ?')){state.stateData={lessons:{},exerciseDone:{},quizScores:{},practiceAnswers:{}};state.answers={};state.shownModels={};saveProgress();renderProgress();notify('Progression réinitialisée')}return}
});
function stopCurrentRecorder(){try{if(state.recorder&&state.recorder.state!=='inactive')state.recorder.stop()}catch(e){}}
document.addEventListener('input',e=>{if(e.target.id==='moduleSearch'||e.target.id==='exerciseSearch'){state.search=e.target.value;if(e.target.id==='moduleSearch')renderModules();else renderExercises();const input=document.getElementById(e.target.id);if(input){input.focus();input.setSelectionRange(input.value.length,input.value.length)}}if(e.target.id==='practiceAnswer'){const ex=currentExerciseData();if(ex){state.answers[getRoundKey(ex)]=e.target.value}}});
document.addEventListener('change',e=>{if(e.target.dataset.checkIndex!==undefined){const ex=currentExerciseData(),key=getRoundKey(ex);const checks=[...document.querySelectorAll('[data-check-index]')].filter(c=>c.checked).map(c=>Number(c.dataset.checkIndex));state.answers[key+'_checks']=checks;}});
// Keep the Modules tab active while a module is open, and Exercises active while an exercise is running.
const originalNavigate=navigate;
navigate=function(page){let active=page==='reader'?'modules':page==='exercise-run'?'exercises':page;state.page=page;document.querySelectorAll('.top-link').forEach(b=>b.classList.toggle('active',b.dataset.page===active));document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));const el=document.getElementById('page-'+page);if(el)el.classList.add('active');renderPage(page);window.scrollTo({top:0,behavior:'smooth'})};
renderPage('overview');

</script>
</body>
</html>
