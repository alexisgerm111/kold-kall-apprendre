edback":"La question invite le prospect à décrire l’effet de la situation."},{"scenario":"Quelle information donne une base à une échéance commerciale ?","prompt":"Choisis la réponse la plus adaptée.","correct":"Une date métier déjà évoquée par le prospect et une conséquence de ne pas la respecter.","wrong":["Une date limite inventée pour accélérer la décision.","Une promotion qui n’a aucun lien avec sa situation.","La préférence du commercial pour une signature avant vendredi."],"feedback":"Une échéance utile se rattache au calendrier et aux conséquences décrites par le client."},{"scenario":"Le prospect signale une difficulté mais n’y associe aucune conséquence. Que faut-il faire ?","prompt":"Choisis la réponse la plus adaptée.","correct":"Explorer les effets et les objectifs concernés avant de présenter l’impact comme important.","wrong":["Affirmer qu’il perd nécessairement de l’argent.","Présenter un scénario catastrophe.","Demander une signature pour éviter la répétition du problème."],"feedback":"La découverte des conséquences permet de déterminer la portée de la difficulté."},{"scenario":"Quel enchaînement produit une chaîne d’impact cohérente ?","prompt":"Choisis la réponse la plus adaptée.","correct":"Situation actuelle, cause, conséquence, objectif affecté, action envisagée.","wrong":["Fonctionnalité, remise, urgence, signature, déploiement.","Crainte, promesse, conclusion, preuve, cause.","Concurrence, slogan, échéance inventée, commande."],"feedback":"La chaîne doit avancer depuis les faits vers leurs effets et ce que le prospect veut faire."},{"scenario":"Le prospect confirme que le comité du 12 novembre requiert les chiffres définitifs. Que demander ?","prompt":"Choisis la réponse la plus adaptée.","correct":"« Quelles validations restent à obtenir pour disposer des chiffres avant le comité ? »","wrong":["« Vous devez donc signer aujourd’hui. »","« Voulez-vous la formule la plus chère ? »","« Vous savez que les retards sont dangereux ? »"],"feedback":"La question relie l’échéance donnée par le prospect aux étapes nécessaires."},{"scenario":"Quelle donnée est nécessaire pour chiffrer le coût du travail manuel ?","prompt":"Choisis la réponse la plus adaptée.","correct":"Le volume de travail actuel et les paramètres de coût retenus, avec leurs hypothèses.","wrong":["Un pourcentage trouvé dans un autre secteur.","Une estimation sans indiquer les hypothèses.","Le chiffre d’affaires global, seul."],"feedback":"Le coût doit pouvoir être retracé aux données qui le composent."},{"scenario":"Le prospect dit que le retard n’affecte aucune décision. Quelle réponse de découverte convient ?","prompt":"Choisis la réponse la plus adaptée.","correct":"Clarifier les priorités et les raisons pour lesquelles il envisage ou non de changer la situation.","wrong":["Insister sur le fait que le problème est forcément important.","Inventer une conséquence financière.","Présenter une urgence artificielle."],"feedback":"L’absence de conséquence identifiée fait partie du diagnostic et doit être comprise."},{"scenario":"Quelle question invite le prospect à évaluer le maintien de la situation ?","prompt":"Choisis la réponse la plus adaptée.","correct":"« Si le fonctionnement reste identique pendant les deux prochains comités, qu’est-ce que cela change pour vous ? »","wrong":["« N’est-il pas dangereux de continuer ainsi ? »","« Notre offre est-elle assez intéressante ? »","« Préférez-vous un appel mardi ou jeudi ? »"],"feedback":"La question explore l’effet du statu quo à un horizon défini."},{"scenario":"Quel cas permet de parler d’une échéance avec le plus de précision ?","prompt":"Choisis la réponse la plus adaptée.","correct":"Le prospect doit présenter une analyse au comité daté et indique quelles décisions en dépendent.","wrong":["Le commercial veut atteindre son objectif mensuel.","Le vendeur affirme que l’offre expire sans confirmation.","Aucune date ou conséquence n’a été évoquée."],"feedback":"La date est pertinente parce que le prospect a donné un événement et les décisions associées."},{"scenario":"Le commercial estime un coût de 40 000 € mais ne connaît pas le volume ni le coût unitaire. Que manque-t-il ?","prompt":"Choisis la réponse la plus adaptée.","correct":"Les données et hypothèses nécessaires pour établir le calcul avec le prospect.","wrong":["Une formulation plus alarmante.","Une remise correspondant au montant estimé.","Un slogan pour rendre le nombre crédible."],"feedback":"Sans éléments de calcul, le montant ne peut pas être présenté comme un résultat fiable."},{"scenario":"Quelle question distingue mieux l’impact opérationnel de l’opinion générale ?","prompt":"Choisis la réponse la plus adaptée.","correct":"« Quelle décision est retardée par l’absence de ces données ? »","wrong":["« Vous trouvez cela embêtant ? »","« Vous aimez les tableaux de bord ? »","« Êtes-vous d’accord que le statu quo coûte cher ? »"],"feedback":"La question recherche un effet opérationnel observable."},{"scenario":"Après avoir clarifié les conséquences, quel mouvement est cohérent ?","prompt":"Choisis la réponse la plus adaptée.","correct":"Reformuler l’écart et vérifier si le prospect veut traiter le besoin et selon quels critères.","wrong":["Passer directement à une pression de closing.","Annoncer une conséquence que le client n’a pas confirmée.","Éviter de demander ce que le prospect envisage."],"feedback":"Le diagnostic doit déboucher sur un besoin reconnu et une réflexion sur l’action."}],"closing":[{"scenario":"Le prospect reconnaît une difficulté mais ne sait pas encore ce qu’il veut obtenir. Quelle conclusion utiliser ?","prompt":"Choisis la réponse la plus adaptée.","correct":"Reformuler et faire valider le besoin avant d’argumenter.","wrong":["Une conclusion alternative sur la date de livraison.","Une demande de commande immédiate.","Une remise pour accélérer la décision."],"feedback":"Le closing sur le besoin précède la conclusion sur la commande."},{"scenario":"Le client valide le bénéfice présenté et les objections essentielles ont été traitées. Quel mouvement vient ensuite ?","prompt":"Choisis la réponse la plus adaptée.","correct":"Formuler une demande de décision claire, adaptée au contexte.","wrong":["Continuer à énumérer des fonctionnalités.","Recommencer toute la découverte.","Envoyer une brochure sans demander de décision."],"feedback":"La conclusion intervient lorsque les éléments utiles ont été travaillés."},{"scenario":"Après une conclusion directe, que doit faire le commercial ?","prompt":"Choisis la réponse la plus adaptée.","correct":"Se taire et laisser le prospect répondre.","wrong":["Ajouter immédiatement une remise.","Reformuler la question plusieurs fois.","Répondre à la place du prospect."],"feedback":"Le silence fait partie de la conclusion directe décrite dans la source."},{"scenario":"Le prospect a décidé de poursuivre et discute la date de démarrage. Quelle forme de conclusion peut convenir ?","prompt":"Choisis la réponse la plus adaptée.","correct":"Une conclusion alternative entre des options d’exécution réalistes.","wrong":["Une nouvelle découverte complète de ses aspirations.","Une stratégie de doute sur sa décision.","Une demande de preuve que le besoin existe."],"feedback":"La conclusion alternative aide à préciser un choix lorsque la décision est avancée."},{"scenario":"Le prospect dit : « Envoyez-moi les informations. » Quelle clarification rend la suite plus engageante ?","prompt":"Choisis la réponse la plus adaptée.","correct":"Définir quelles informations sont nécessaires, comment elles seront utilisées et quand reprendre la décision.","wrong":["Envoyer un mail sans convenir de suite.","Supposer qu’il décidera à réception.","Considérer la demande comme un accord de principe."],"feedback":"Une prochaine étape utile nomme l’action et la suite, plutôt qu’un envoi vague."},{"scenario":"Quel élément n’appartient pas à une prochaine étape bien définie ?","prompt":"Choisis la réponse la plus adaptée.","correct":"Une action dont personne ne sait qui doit l’accomplir.","wrong":["Un responsable identifié.","Une échéance convenue.","Un objectif de décision clair."],"feedback":"Une étape doit être observable et comprise de la même manière par les deux parties."},{"scenario":"Un prospect demande les modalités de mise en œuvre après avoir validé l’offre. Que doit faire le commercial ?","prompt":"Choisis la réponse la plus adaptée.","correct":"Préciser les modalités avec une alternative ou une question adaptée à ce choix.","wrong":["Revenir à la première question de découverte.","Éviter la conclusion par peur de paraître insistant.","Présenter tous les bénéfices déjà validés une nouvelle fois."],"feedback":"Les questions de modalité peuvent refléter un stade de décision plus avancé."},{"scenario":"Le client reste bloqué sur une objection précise au moment de conclure. Quel mouvement faire ?","prompt":"Choisis la réponse la plus adaptée.","correct":"Revenir à cette objection, la faire préciser et traiter le point qui bloque.","wrong":["Demander la commande à nouveau sans diagnostic.","Faire comme si l’objection était levée.","Proposer deux dates sans répondre au blocage."],"feedback":"Une conclusion ne remplace pas le traitement d’une objection encore ouverte."},{"scenario":"Quelle phrase constitue la demande la plus explicite ?","prompt":"Choisis la réponse la plus adaptée.","correct":"« Souhaitez-vous que nous formalisions la commande aujourd’hui ? »","wrong":["« Je vous envoie un petit récapitulatif. »","« On se tient au courant. »","« Vous voyez l’idée. »"],"feedback":"La demande explicite porte clairement sur une décision."},{"scenario":"Quel usage de l’alternative est le plus adapté ?","prompt":"Choisis la réponse la plus adaptée.","correct":"Le prospect semble décidé et doit choisir entre deux options de livraison compatibles avec son calendrier.","wrong":["Le besoin n’a pas encore été reconnu.","Le prospect a exprimé un refus catégorique.","Le commercial n’a pas encore présenté de bénéfice."],"feedback":"L’alternative est adaptée à la précision du choix après une décision suffisamment avancée."},{"scenario":"Pourquoi la validation du bénéfice ne vaut-elle pas automatiquement commande ?","prompt":"Choisis la réponse la plus adaptée.","correct":"Parce que l’accord porte sur un bénéfice précis, pas sur toutes les conditions de l’achat.","wrong":["Parce que toute validation est sans valeur commerciale.","Parce qu’il faut toujours présenter plus de caractéristiques.","Parce qu’un bénéfice ne peut jamais influencer une décision."],"feedback":"La source distingue le closing sur le bénéfice et le closing sur la commande."},{"scenario":"Le prospect doit obtenir l’approbation du comité du 12 novembre. Quelle étape proposer ?","prompt":"Choisis la réponse la plus adaptée.","correct":"Préparer les éléments demandés puis convenir d’une date précise pour reprendre la décision après le comité.","wrong":["Envoyer un mail et attendre indéfiniment.","Demander une signature avant le comité sans discuter le processus.","Remettre à plus tard sans identifier le responsable ni l’échéance."],"feedback":"La suite doit s’appuyer sur le processus de décision que le prospect a décrit."}],"pressure":[{"scenario":"Le prospect dit : « Vous ne m’écoutez pas, vous récitez votre argumentaire. » Quelle phrase réflexe prépare la clarification ?","prompt":"Choisis la réponse la plus adaptée.","correct":"« Qu’est-ce que j’ai laissé de côté ou mal compris dans ce que vous venez de m’expliquer ? »","wrong":["« Ce n’est pas vrai, je vous ai déjà posé plusieurs questions. »","« Si vous me laissez finir, vous verrez. »","« Je vais reprendre le début de ma présentation. »"],"feedback":"La question vise à comprendre ce qui a déclenché la réaction."},{"scenario":"Après avoir posé une question de conclusion, le commercial ressent le besoin de justifier le prix une nouvelle fois. Quelle action entraîne le bon réflexe ?","prompt":"Choisis la réponse la plus adaptée.","correct":"Ne rien ajouter et laisser le prospect répondre.","wrong":["Introduire une remise immédiatement.","Reformuler la question jusqu’à obtenir une réponse.","Changer de sujet pour éviter le silence."],"feedback":"Le silence après la conclusion directe permet au client de prendre la parole."},{"scenario":"Le prospect hausse le ton et dit : « Vous êtes comme tous les autres, vous promettez beaucoup. » Quel est le premier mouvement utile ?","prompt":"Choisis la réponse la plus adaptée.","correct":"Demander quelle promesse ou quel point précis lui paraît insuffisamment étayé.","wrong":["Affirmer que l’entreprise est leader.","Répondre que le prospect généralise.","Réciter les chiffres de l’entreprise sans clarification."],"feedback":"Le commentaire est général ; le commercial doit obtenir le point concret."},{"scenario":"Quelle technique est au cœur d’une phrase réflexe bien préparée ?","prompt":"Choisis la réponse la plus adaptée.","correct":"Une formulation courte qui permet de clarifier, questionner ou reprendre le fil sans improviser une défense.","wrong":["Une réponse exhaustive à réciter quelle que soit la situation.","Une contre-attaque qui fait cesser la critique.","Une nouvelle caractéristique produit à chaque objection."],"feedback":"Le chapitre recommande de disposer de réflexes préparés pour les moments difficiles."},{"scenario":"Le prospect interrompt la présentation : « Vous ne répondez pas à ma question. » Que faut-il faire ?","prompt":"Choisis la réponse la plus adaptée.","correct":"Demander ou identifier précisément la question laissée sans réponse, puis y répondre.","wrong":["Accélérer la présentation pour finir.","Expliquer que la présentation a été préparée pour son secteur.","Changer de sujet vers un bénéfice plus fort."],"feedback":"Il faut revenir au point exprimé par le prospect."},{"scenario":"Pourquoi faut-il préparer les questions réflexes avant le rendez-vous ?","prompt":"Choisis la réponse la plus adaptée.","correct":"Pour avoir des formulations disponibles et une trame de questionnement lorsque la situation devient difficile.","wrong":["Pour pouvoir suivre un script sans écouter.","Pour supprimer toute spontanéité chez le vendeur.","Pour éviter que le prospect puisse objecter."],"feedback":"La préparation permet de conserver les mouvements utiles en situation de tension."},{"scenario":"Le prospect répond de façon vague à une question sur les causes. Quelle réaction maintient la découverte ?","prompt":"Choisis la réponse la plus adaptée.","correct":"Poser une question ciblée qui précise le mécanisme ou l’étape concernée.","wrong":["Passer à la démonstration pour relancer l’intérêt.","Compléter la réponse à sa place.","Conclure sur le besoin sans vérification."],"feedback":"Une réponse vague laisse le diagnostic incomplet."},{"scenario":"Une objection arrive pendant que le commercial présente une fonctionnalité. Quel est le meilleur réflexe immédiat ?","prompt":"Choisis la réponse la plus adaptée.","correct":"Écouter puis faire préciser le point qui fait objection.","wrong":["Ignorer l’objection jusqu’à la fin du pitch.","Se justifier en présentant trois autres fonctions.","Demander une commande pour tester la motivation."],"feedback":"La clarification évite de répondre à côté de l’objection exprimée."},{"scenario":"Le prospect garde le silence après une question ouverte. Quel réflexe faut-il entraîner ?","prompt":"Choisis la réponse la plus adaptée.","correct":"Laisser un temps de réponse avant de compléter ou reformuler.","wrong":["Parler immédiatement pour remplir le vide.","Enchaîner avec une question fermée suggestive.","Donner les réponses possibles à sa place."],"feedback":"Le silence permet au prospect de construire sa réponse."},{"scenario":"Quel est le bon réflexe après avoir reçu une critique ?","prompt":"Choisis la réponse la plus adaptée.","correct":"Chercher à comprendre ce qui déplaît avant de décider comment agir.","wrong":["Protéger son image en démontrant que la critique est injuste.","Faire une promesse pour clore la discussion.","Ignorer la critique et continuer le programme prévu."],"feedback":"C’est la logique du réflexe « Qu’est-ce qui te fait réagir comme cela ? » dans la source."},{"scenario":"Le prospect répète la même objection après une réponse. Que faire ?","prompt":"Choisis la réponse la plus adaptée.","correct":"Vérifier ce qui n’est pas encore résolu ou mal compris.","wrong":["Répéter exactement la même réponse plus fort.","Supposer que la vente est perdue et terminer.","Offrir une remise sans clarifier."],"feedback":"La répétition signale que le point n’a pas été traité ou reconnu."},{"scenario":"Quel entraînement vérifie que le réflexe est réellement disponible ?","prompt":"Choisis la réponse la plus adaptée.","correct":"Produire la réponse sans support dans plusieurs scénarios, puis comparer à une grille stable.","wrong":["Relire la formule plusieurs fois sans la dire.","Mémoriser seulement le nom de la technique.","Faire un exercice unique puis considérer la compétence acquise."],"feedback":"Le rappel sans aide dans plusieurs contextes teste l’accès au comportement."}],"eloquence":[{"scenario":"« Du coup, en gros, notre outil va un peu vous aider à être plus efficaces. » Quelle reformulation est la plus précise ?","prompt":"Choisis la réponse la plus adaptée.","correct":"« L’outil regroupe les données des régions pour que vous puissiez comparer les écarts avant la réunion. »","wrong":["« Notre outil est une solution moderne et innovante. »","« En fait, cela va rendre tout plus performant. »","« Du coup, vous aurez accès à beaucoup de possibilités. »"],"feedback":"La formulation précise la capacité et l’usage métier, sans mots de remplissage."},{"scenario":"La question du dirigeant est : « Qu’est-ce que cela change pour moi ? » Quelle structure doit venir en premier ?","prompt":"Choisis la réponse la plus adaptée.","correct":"Le message principal, puis le lien avec son besoin et une question de validation.","wrong":["Une longue introduction sur l’entreprise.","Une liste de caractéristiques non hiérarchisées.","Une phrase d’excuse avant de commencer."],"feedback":"L’idée principale doit arriver avant les détails."},{"scenario":"Quel remplacement convient le mieux à « truc », « chose » ou « machin » dans une réponse à un C-level ?","prompt":"Choisis la réponse la plus adaptée.","correct":"Nommer l’action, la donnée ou le résultat précis que l’on désigne.","wrong":["Utiliser un mot plus compliqué même s’il est imprécis.","Ajouter « efficacement » pour paraître professionnel.","Supprimer l’information sans la remplacer."],"feedback":"La précision lexicale permet au décideur de comprendre ce qui change."},{"scenario":"Tu répètes « en fait » à plusieurs reprises au début de chaque phrase. Quelle stratégie d’entraînement est la plus utile ?","prompt":"Choisis la réponse la plus adaptée.","correct":"Identifier les ouvertures concernées et commencer chaque réponse par son idée principale.","wrong":["Tenter de parler deux fois plus vite.","Remplacer tous les « en fait » par « néanmoins ».","Apprendre un texte long mot pour mot."],"feedback":"Il faut remplacer le tic par une structure d’ouverture plus nette."},{"scenario":"Quelle réponse orale suit une structure claire en trois temps ?","prompt":"Choisis la réponse la plus adaptée.","correct":"« Les données sont regroupées dans un état commun. L’équipe évite des rapprochements manuels avant le comité. Est-ce la difficulté prioritaire à résoudre ? »","wrong":["« Alors voilà, donc nous, en fait, on a une plateforme intéressante. »","« Nous avons de nombreux modules, fonctions et options. »","« Ça marche mieux et c’est plus simple et efficace. »"],"feedback":"L’exemple expose le point, le bénéfice puis une question de validation."},{"scenario":"Tu termines les phrases par « et tout ça », sans préciser l’objet. Que faire ?","prompt":"Choisis la réponse la plus adaptée.","correct":"Remplacer l’expression par les éléments précis que tu veux inclure ou terminer la phrase.","wrong":["La conserver pour garder un ton détendu.","Ajouter une nouvelle parenthèse.","Remplacer par une autre formule vague."],"feedback":"La formulation doit donner une limite claire à l’idée exprimée."},{"scenario":"Le client demande un bénéfice, mais le commercial n’a pas les données pour le chiffrer. Quelle phrase est la plus solide ?","prompt":"Choisis la réponse la plus adaptée.","correct":"« Le processus réduit les rapprochements manuels ; nous pouvons estimer le temps gagné à partir de votre volume réel. »","wrong":["« Vous gagnerez 30 % dès le premier mois. »","« Cela augmente forcément votre rentabilité. »","« Le gain sera énorme, même si je ne l’ai pas mesuré. »"],"feedback":"La formulation distingue le mécanisme connu du chiffre qu’il reste à établir."},{"scenario":"Une réponse part sur quatre sujets et ne répond qu’à la fin. Quelle correction choisir ?","prompt":"Choisis la réponse la plus adaptée.","correct":"Placer la réponse principale en premier, puis garder un ou deux éléments qui l’expliquent.","wrong":["Ajouter un résumé plus long en introduction.","Conserver les quatre sujets dans la même phrase.","Supprimer la réponse principale et garder les exemples."],"feedback":"La réponse devient plus facile à suivre quand l’idée directrice arrive d’abord."},{"scenario":"Quel vocabulaire est le plus adapté à un décideur qui veut comprendre l’effet du retard de reporting ?","prompt":"Choisis la réponse la plus adaptée.","correct":"« Les chiffres arrivent après le comité, ce qui limite la comparaison des écarts avant l’arbitrage. »","wrong":["« Ça complique un peu le truc côté reporting. »","« Notre technologie est disruptive et next-generation. »","« Vous allez bénéficier d’une excellence opérationnelle holistique. »"],"feedback":"Le vocabulaire précis décrit le fait et sa conséquence sans jargon inutile."},{"scenario":"Tu enregistres une réponse et veux mesurer un progrès réel. Que compares-tu ?","prompt":"Choisis la réponse la plus adaptée.","correct":"Deux prises comparables sur l’idée principale, les tics répétitifs, la précision et la clarté de la demande.","wrong":["Seulement le ressenti global après chaque prise.","Deux prises sur des questions complètement différentes et sans grille.","Uniquement le nombre de mots utilisés."],"feedback":"Une comparaison utile conserve une grille stable et un objectif comparable."},{"scenario":"Quelle phrase devrait être coupée en deux pour clarifier l’idée ?","prompt":"Choisis la réponse la plus adaptée.","correct":"« La vue rassemble les chiffres, elle fait ressortir les écarts, et les managers peuvent les comparer avant le comité. »","wrong":["« Les chiffres sont regroupés dans une vue unique. »","« Les managers comparent les écarts avant le comité. »","« Quel résultat voulez-vous prioriser ? »"],"feedback":"La première formulation rassemble plusieurs mouvements ; séparer capacité et bénéfice clarifie le raisonnement."},{"scenario":"Comment distinguer une pause utile d’un tic verbal ?","prompt":"Choisis la réponse la plus adaptée.","correct":"La pause laisse le temps de réfléchir ; le tic répétitif n’apporte pas d’information et peut masquer le message.","wrong":["Toute pause est une faute d’élocution.","Tout tic augmente nécessairement la crédibilité.","Il faut supprimer toute hésitation, même quand la réflexion continue."],"feedback":"Le travail cible les répétitions qui brouillent le message, pas toute pause naturelle."}]},"practice":{"discovery":[{"scenario":"Le prospect dit : « Nous devons moderniser notre suivi commercial. »","prompt":"Formule la prochaine question qui fera préciser le résultat recherché.","model":"« Qu’aimeriez-vous pouvoir faire ou décider plus facilement avec ce nouveau suivi ? »","checks":["Je fais préciser le résultat souhaité.","Je n’introduis pas de produit ni de solution.","La question invite à donner une réponse concrète."]},{"scenario":"« Nous passons trop de temps à compiler les chiffres le vendredi. »","prompt":"Écris une question sur la cause, puis une question sur les conséquences.","model":"Cause : « Qu’est-ce qui rend cette compilation aussi longue aujourd’hui ? » Conséquence : « Qu’est-ce que ce temps de compilation empêche votre équipe de faire ? »","checks":["Je distingue bien cause et conséquence.","Je pose une seule intention par question.","Je n’affirme pas d’impact non confirmé."]},{"scenario":"« Les retards arrivent surtout en fin de mois. »","prompt":"Construis une mini-séquence sur les faits, les causes et l’action envisagée.","model":"« Quelles étapes prennent du retard en fin de mois ? » puis « Qu’est-ce qui explique ce pic de retard ? » puis « Qu’avez-vous déjà tenté pour y remédier ? »","checks":["La première question recueille un fait contextualisé.","La deuxième cherche une cause.","La troisième explore les actions déjà tentées."]},{"scenario":"Le prospect : « Je veux surtout une vision fiable avant le comité de direction. »","prompt":"Reformule le besoin en deux ou trois phrases et demande validation.","model":"« Vous cherchez un état fiable avant le comité pour comparer les écarts et préparer les arbitrages. Aujourd’hui, le délai de consolidation limite cette préparation. Qu’est-ce que je dois corriger ou compléter ? »","checks":["Je reprends les mots du prospect.","Je relie situation et résultat attendu.","Je termine par une demande de validation."]},{"scenario":"« Nous avons déjà essayé un autre outil et cela n’a pas changé grand-chose. »","prompt":"Écris deux questions pour comprendre l’essai passé et le critère de réussite.","model":"« Qu’est-ce qui a été mis en place et utilisé par les équipes ? » puis « Quel résultat aurait permis de considérer cet essai comme réussi ? »","checks":["Je cherche des faits sur l’essai précédent.","Je fais expliciter le critère de réussite.","Je n’invente pas la cause de l’échec."]},{"scenario":"Le prospect décrit plusieurs problèmes, sans ordre de priorité.","prompt":"Formule une question qui révèle ses priorités actuelles.","model":"« Parmi ces difficultés, laquelle affecte le plus vos objectifs aujourd’hui, et pourquoi ? »","checks":["Je demande une hiérarchisation.","Je demande le pourquoi de la priorité.","Je n’impose pas ma propre priorité."]},{"scenario":"« Les commerciaux n’utilisent pas les données du CRM. »","prompt":"Prépare une question sur les faits, puis une sur la cause.","model":"« Dans quelles situations les données ne sont-elles pas utilisées ? » puis « Qu’est-ce qui explique qu’elles ne soient pas utilisées dans ces situations ? »","checks":["Je cherche un contexte concret.","Je distingue fait et cause.","J’évite d’accuser les utilisateurs."]},{"scenario":"Le prospect corrige ta reformulation et insiste sur la qualité des données, pas sur leur disponibilité.","prompt":"Réécris la reformulation en intégrant la correction, sans mentionner la solution.","model":"« Le point principal n’est donc pas le délai d’accès, mais la fiabilité des données utilisées pour arbitrer. Vous souhaitez pouvoir comparer les régions sur une base fiable. Est-ce que cette formulation correspond à votre priorité ? »","checks":["J’intègre la correction du client.","Je ne défends pas mon premier diagnostic.","Je vérifie la nouvelle formulation."]},{"scenario":"« Nous voudrions améliorer le pilotage. »","prompt":"Écris une question qui remplace « améliorer » par un résultat observable.","model":"« Quelle décision ou quel indicateur voudriez-vous pouvoir suivre plus tôt ou plus précisément ? »","checks":["Je transforme un mot général en objet précis.","La question porte sur l’usage ou la décision.","Je ne suppose pas le besoin."]},{"scenario":"Le prospect dit que la situation actuelle est acceptable mais veut quand même étudier une évolution.","prompt":"Prépare une question sur les critères qui feraient choisir ou écarter une solution.","model":"« Quels critères vous permettraient de décider qu’une évolution vaut réellement la peine par rapport au fonctionnement actuel ? »","checks":["Je traite la situation actuelle comme une référence.","Je fais expliciter les critères de décision.","Je n’invente pas un problème pour forcer l’action."]},{"scenario":"« Nous souhaitons passer d’un reporting mensuel à un suivi hebdomadaire. »","prompt":"Prépare une question sur les conséquences de ce changement et une sur les actions envisagées.","model":"« Quelles décisions seraient différentes avec un suivi hebdomadaire ? » puis « Qu’avez-vous prévu pour passer à ce rythme ? »","checks":["Je questionne les effets recherchés.","J’explore l’action ou la préparation.","Je ne pars pas immédiatement sur les fonctionnalités."]},{"scenario":"Le prospect explique situation, cause, conséquences et objectif.","prompt":"Produis une reformulation complète, fidèle et validable en 30 secondes.","model":"Structure attendue : situation actuelle confirmée ; cause identifiée par le prospect ; conséquence explicitement citée ; résultat souhaité ; question finale de validation. Ne rajoute aucune promesse ni chiffre absent du contexte.","checks":["Je garde les faits exacts.","Je relie la difficulté à une conséquence citée.","Je formule l’objectif avec le vocabulaire du client.","Je sollicite une correction ou validation."]}],"objections":[{"scenario":"Prospect : « Votre offre est trop chère. » Tu ne connais pas son référentiel.","prompt":"Rédige une première question de clarification et une réponse possible après clarification.","model":"Clarification : « Par rapport à qui ou à quoi vous paraît-elle trop chère ? » La réponse suivante dépendra du référentiel donné : budget, comparaison concurrentielle ou bénéfice attendu.","checks":["Je demande de préciser le motif.","Je n’offre pas de remise avant diagnostic.","Je ne présente pas encore une réfutation générique."]},{"scenario":"Prospect : « Votre entreprise est trop petite. »","prompt":"Formule la question de clarification du texte fourni, puis indique les critères à traiter selon la réponse.","model":"« Qu’est-ce qu’une entreprise de grande taille peut vous apporter que nous ne puissions pas vous fournir ? » La réponse doit ensuite se rattacher au critère exprimé : couverture, capacité, continuité de service, ressources ou autre point précisé par le prospect.","checks":["Je clarifie le sens de « trop petite ».","Je réponds au critère exprimé.","Je ne présume pas de la réponse du prospect."]},{"scenario":"Prospect : « Je vais réfléchir. »","prompt":"Choisis une des treize techniques du document, puis écris une ouverture fidèle à cette technique.","model":"Exemple de technique possible : « déminage », qui consiste à faire réfléchir le client avant la tentative de conclusion, en examinant avec lui les éléments nécessaires à sa décision. D’autres techniques du document peuvent être choisies selon le contexte.","checks":["Je nomme une technique du document.","La formulation correspond au mécanisme de cette technique.","Je n’affirme pas connaître la raison réelle sans l’avoir établie."]},{"scenario":"Prospect : « Vos produits se ressemblent tous. »","prompt":"Construis une analogie issue d’un autre domaine, puis ramène-la au critère de choix du prospect.","model":"Exemple de structure : reconnaître que certains composants sont comparables ; prendre un domaine dans lequel des éléments de base similaires produisent des résultats différents ; relier la différence à la conception, à l’usage ou au bénéfice recherché par le prospect.","checks":["Je crée un parallèle compréhensible.","Je reviens au sujet commercial.","Je relie le raisonnement à un critère du prospect."]},{"scenario":"Le prospect met en doute une comparaison concurrentielle. Tu as une caractéristique vérifiée et un critère de choix explicitement cité.","prompt":"Construis un raisonnement CIP en trois phrases.","model":"Caractéristique concurrente vérifiée ; inconvénient concret susceptible d’en découler ; perte possible reliée au critère de choix exprimé par le prospect. Chaque étape doit se fonder sur un élément vérifiable.","checks":["Je distingue caractéristique, inconvénient et perte.","Je relie la perte au critère client.","Je ne présente pas un risque hypothétique comme un fait."]},{"scenario":"Prospect : « Votre entreprise n’est pas connue. »","prompt":"Formule la clarification proposée dans le texte, puis décris ce qu’il faut apprendre avant de répondre.","model":"« Quelle image avez-vous de nous ? » ou « Puis-je vous demander quelles sont vos sources ? » Il faut identifier la réputation ou les informations visées avant de choisir les éléments de réponse.","checks":["Je demande l’image ou les sources.","Je ne contre-attaque pas.","Je prépare une réponse correspondant au point révélé."]},{"scenario":"Le prospect dit « Je vais réfléchir ». Tu choisis le mentaliste.","prompt":"Enregistre une ouverture orale qui énonce une ou deux préoccupations possibles, puis enchaîne avec le bénéfice déjà validé.","model":"Exemple de structure : « Quand vous me dites vouloir réfléchir, je peux entendre que vous voulez éviter de regretter votre choix ou vérifier que vous faites le meilleur choix possible. Je vais reprendre les bénéfices que vous avez identifiés comme importants… » Enchaîne ensuite avec les bénéfices réellement confirmés dans le scénario.","checks":["Je nomme des préoccupations comme possibilités, pas comme faits établis.","Je passe directement à la réassurance prévue par la technique.","Je reprends des bénéfices déjà reliés au besoin."]},{"scenario":"Le client hésite entre deux options qui lui plaisent. Prépare la technique du maître d’hôtel.","prompt":"Enregistre un récit bref, demande une préférence révélatrice puis formule une recommandation de professionnel.","model":"Raconte un choix difficile dans un autre domaine ; pose une question sur la préférence du client ; recommande ensuite l’option de l’offre qui correspond à cette préférence et explique pourquoi.","checks":["Je raconte une analogie compréhensible.","La préférence du prospect guide ma recommandation.","Je formule un conseil explicite lié à son choix."]},{"scenario":"Le client veut réfléchir quelques jours. Tu utilises l’invitation à réfléchir.","prompt":"Formule la proposition de réflexion dans l’entretien et indique ce que tu fais pendant ce temps.","model":"« Je comprends. Je vous propose de prendre quelques minutes pour réfléchir entre vous. Je dois passer quelques appels ; je reste à proximité et je reviens dans dix minutes. » Si le client souhaite toujours reporter de plusieurs jours, prépare ensuite une transition vers le révélateur.","checks":["Je propose un temps de réflexion pendant le rendez-vous.","Je précise ce que je fais et quand je reviens.","Je prévois la suite si le client refuse ce cadre."]},{"scenario":"Le prospect est lui-même commercial et dit « Je vais réfléchir ». Prépare l’inversion des rôles.","prompt":"Imagine le scénario vu depuis sa position professionnelle, puis pose la question centrale de la technique.","model":"« Vous connaissez ce métier : imaginez que vous ayez consacré du temps à comprendre les besoins d’un client et préparé une proposition qui y répond. À votre place, insisteriez-vous pour expliquer les derniers bénéfices ou abandonneriez-vous ? » Reprends ensuite la réponse du prospect.","checks":["Je l’invite à prendre la position du vendeur.","Je décris une proposition reliée au besoin.","Je fais suivre la réponse de la transition prévue."]},{"scenario":"Le prospect répond à l’échelle 0–10 : « 8 ». Prépare la suite exacte du mouvement.","prompt":"Enregistre la réaction qui s’appuie sur la note et fait préciser ce qui manque pour atteindre l’accord.","model":"« 8 ? Nous sommes donc assez proches d’un accord. Qu’est-ce qui manque pour passer de 8 à 10 ? » La suite dépend de la réponse : traite le point manquant au lieu de deviner sa nature.","checks":["Je reprends la note donnée.","Je demande ce qui manque pour avancer.","Je traite l’élément nommé par le prospect."]},{"scenario":"Choisis entre faute professionnelle, effet Colombo, aveu, coulisses du métier, mauvais élève et conseil de Socrate.","prompt":"Enregistre une ouverture fidèle à une de ces techniques et décris la suite selon la réponse du prospect.","model":"Sélectionne une technique, restitue son mécanisme et enchaîne conformément à sa logique : demander ce qui n’était pas convaincant ; revenir avec une dernière question après le départ apparent ; exprimer l’investissement personnel ; expliciter les coulisses du métier et proposer un échange ; laisser partir le client après le récit du mauvais élève ; ou appuyer la recommandation par une citation connue.","checks":["La technique choisie est identifiable.","La phrase d’ouverture appartient au déroulé choisi.","La suite dépend de la réponse réelle du prospect."]}],"value":[{"scenario":"Le prospect veut que ses régions repèrent les opportunités sans activité avant le comité.","prompt":"Écris un argument CAB court.","model":"Caractéristique : alertes sur les opportunités sans activité au-delà d’un seuil choisi. Avantage : les dossiers concernés ressortent sans tri manuel. Bénéfice : le responsable peut hiérarchiser les relances avant le comité. Validation : « Cela vous aiderait-il à préparer la revue avec les dossiers réellement bloqués ? »","checks":["La caractéristique est une capacité identifiable.","L’avantage explique l’effet opérationnel.","Le bénéfice reprend le besoin énoncé.","Une question vérifie la valeur pour le client."]},{"scenario":"Caractéristique disponible : export automatique des données vers un tableau partagé. Le prospect veut éviter plusieurs versions divergentes du reporting.","prompt":"Écris l’avantage et le bénéfice ; ne recommence pas par la caractéristique.","model":"Avantage : les données sont réunies dans un tableau commun plutôt que ressaisies dans plusieurs fichiers. Bénéfice : les équipes préparent leurs arbitrages sur une même base de chiffres, si cette centralisation couvre bien les sources concernées.","checks":["L’avantage découle de la caractéristique.","Le bénéfice se rattache au problème des versions divergentes.","Je précise une condition si toutes les sources ne sont pas couvertes."]},{"scenario":"Le prospect veut raccourcir la préparation d’une réunion hebdomadaire.","prompt":"Formule le bénéfice en langage métier, sans promesse chiffrée non vérifiée.","model":"« Les données sont regroupées avant la réunion, ce qui réduit les rapprochements manuels nécessaires à sa préparation. Pour chiffrer le gain, il faudrait mesurer le temps consacré aujourd’hui à ces tâches. »","checks":["Le bénéfice est formulé comme un effet concret.","Je n’invente pas de pourcentage.","Je distingue mécanisme et mesure du gain."]},{"scenario":"Une fonctionnalité différenciante n’a aucun lien avec le besoin déclaré par le prospect.","prompt":"Explique si tu dois l’inclure dans l’argumentaire et pourquoi.","model":"Non, pas à ce stade. Une caractéristique n’a sa place comme argument que si elle procure un avantage utile lié à un besoin ou un critère du prospect. Garde-la en réserve si un besoin pertinent apparaît.","checks":["Je ne confonds pas différence technique et valeur client.","Je relie la sélection au besoin reconnu.","Je n’énumère pas les fonctions par exhaustivité."]},{"scenario":"Tu as présenté un bénéfice et le prospect répond : « C’est intéressant, mais je dois comparer les vues régionales. »","prompt":"Formule la question qui précise le critère de comparaison avant de poursuivre l’argumentation.","model":"« Quels éléments doivent pouvoir être comparés entre les régions pour que la vue réponde à votre besoin ? » Puis adapte la démonstration au critère exprimé.","checks":["Je demande une précision sur le besoin.","Je n’empile pas un argument générique.","Je fais évoluer la démonstration selon la réponse."]},{"scenario":"Le prospect te demande : « Combien d’heures allons-nous gagner ? » Tu ne connais pas le volume actuel.","prompt":"Réponds clairement et propose la méthode permettant de chiffrer le bénéfice.","model":"« Je ne peux pas chiffrer ce gain sans connaître votre volume et le temps consacré aujourd’hui à la consolidation. Si nous établissons ces données, nous pourrons calculer une estimation et préciser les hypothèses. »","checks":["Je ne fabrique pas de chiffre.","Je nomme les données manquantes.","Je propose une suite concrète pour établir le gain."]},{"scenario":"Caractéristique : mise à jour à fréquence définie. Besoin : détecter les écarts avant une revue commerciale.","prompt":"Construis la chaîne CAB et termine par une validation.","model":"Caractéristique : actualisation selon la fréquence prévue. Avantage : les écarts sont visibles selon un rythme régulier. Bénéfice possible : le responsable peut repérer les écarts avant la revue, à condition que la fréquence corresponde à son calendrier. Validation : « Une actualisation à ce rythme répondrait-elle à votre besoin ? »","checks":["Les trois étapes sont distinctes.","Le bénéfice est relié au calendrier client.","Je vérifie la pertinence au lieu de l’imposer."]},{"scenario":"Le prospect a cité trois priorités : qualité des données, préparation plus rapide, présentation plus lisible.","prompt":"Choisis un ordre argumentaire et explique brièvement le choix.","model":"Commence par la priorité que le prospect a présentée comme la plus importante. Relie une caractéristique vérifiée à cette priorité, démontre l’avantage, formule le bénéfice puis valide. Ne suppose pas que la présentation visuelle passe avant la qualité si le prospect a hiérarchisé autrement.","checks":["Je suis la priorité exprimée.","Je construis un argument à la fois.","Je vérifie l’ordre plutôt que de le supposer."]},{"scenario":"Le commercial a présenté une longue liste de fonctions. Le prospect ne voit pas ce qui change pour lui.","prompt":"Réécris la réponse en un argument CAB ciblé sur le besoin confirmé.","model":"Repars d’une phrase du prospect qui décrit le besoin. Garde une caractéristique pertinente, explique l’avantage et nomme le bénéfice. Retire toutes les fonctions sans lien avec ce besoin.","checks":["Je sélectionne une seule caractéristique pertinente.","Je complète avantage et bénéfice.","Je retire les fonctions hors sujet."]},{"scenario":"Le prospect reconnaît un bénéfice et ajoute une réserve sur la fiabilité des données.","prompt":"Formule une question de découverte avant de présenter une nouvelle preuve.","model":"« Quels contrôles ou quelles sources doivent être fiables pour que vous puissiez utiliser cette vue dans vos arbitrages ? » La réponse définit le critère que la preuve devra couvrir.","checks":["Je clarifie la réserve.","Je ne prétends pas que la preuve est suffisante sans critère.","Je prépare l’argument à partir de la réponse."]},{"scenario":"Tu peux démontrer une fonction mais pas encore le résultat métier exact chez ce prospect.","prompt":"Distingue la preuve disponible du bénéfice à vérifier.","model":"La démonstration peut établir que la fonction réalise l’action prévue. Le bénéfice métier dépend ensuite de l’usage, du périmètre et des conditions du prospect. Expose ce que tu peux montrer, puis identifie les données et critères nécessaires pour confirmer le résultat attendu.","checks":["Je distingue fonction démontrée et résultat métier.","Je précise les conditions encore inconnues.","Je ne généralise pas au-delà de la preuve."]},{"scenario":"Prépare une réponse orale de 30 secondes à : « Pourquoi choisir votre solution ? » Le besoin confirmé est la disponibilité des chiffres avant le comité.","prompt":"Écris le script oral en trois phrases maximum.","model":"« Vous souhaitez disposer de chiffres fiables avant le comité. Notre vue réunit les données concernées pour éviter les rapprochements manuels ; cela peut vous permettre de comparer les écarts avant la réunion. Si cette couverture correspond à vos sources, est-ce le résultat que vous cherchez ? »","checks":["Je commence par le besoin.","Je décris la caractéristique et son avantage.","Je formule le bénéfice et vérifie sa pertinence."]}],"urgency":[{"scenario":"Le prospect explique que les relances commerciales partent parfois deux jours après le signal d’intérêt.","prompt":"Écris une question d’implication qui ne suppose pas que la vente est perdue.","model":"« Qu’est-ce que ce délai change dans la suite des échanges avec les prospects concernés ? »","checks":["Je relie la question à un fait décrit.","Je demande une conséquence, sans la présumer.","Je ne transforme pas une hypothèse en perte certaine."]},{"scenario":"Les chiffres arrivent après le comité de direction. Le prospect a indiqué que le comité arbitre les priorités régionales.","prompt":"Construis une question sur la conséquence puis une question sur le résultat souhaité.","model":"« Quelles décisions deviennent plus difficiles lorsque les chiffres arrivent après le comité ? » puis « De quelles informations auriez-vous besoin avant la réunion pour arbitrer ces priorités ? »","checks":["Je demande d’abord une conséquence.","Je fais ensuite expliciter le résultat souhaité.","Je conserve le lien avec les décisions citées."]},{"scenario":"Le prospect reconnaît une conséquence financière mais ne connaît pas son montant.","prompt":"Prépare une question pour collecter les données nécessaires au calcul.","model":"« Quels volumes sont concernés, à quelle fréquence cela se produit-il et quelles données avez-vous sur le coût associé ? » Le calcul dépendra ensuite des paramètres validés.","checks":["Je recherche volumes et fréquence.","Je cherche une base de coût vérifiable.","Je ne prétends pas connaître le montant avant le calcul."]},{"scenario":"Le prospect a un comité budgétaire le 12 novembre. Le projet doit être chiffré avant cette date.","prompt":"Propose une question qui explore les étapes nécessaires pour respecter l’échéance.","model":"« Quelles validations et quelles informations devez-vous obtenir avant le 12 novembre pour présenter le projet au comité ? »","checks":["Je pars d’une date donnée par le prospect.","Je cherche les étapes et dépendances réelles.","Je n’ajoute pas une fausse date limite commerciale."]},{"scenario":"Le prospect minimise le problème : « Nous finissons toujours le reporting, même si c’est tard. »","prompt":"Formule une question qui examine ce que change le retard, sans imposer qu’il soit grave.","model":"« Lorsque le reporting arrive tard, quelles décisions peuvent encore être prises à temps, et lesquelles doivent attendre ? »","checks":["Je laisse le client évaluer la portée de l’effet.","Je cherche une différence opérationnelle observable.","Je ne dramatise pas."]},{"scenario":"Le prospect décrit la situation actuelle, la cause et les conséquences. Il souhaite améliorer la qualité des arbitrages.","prompt":"Reformule le coût du statu quo et demande validation.","model":"« Aujourd’hui, la consolidation manuelle retarde la disponibilité des chiffres ; cela complique la comparaison des régions avant l’arbitrage. Vous souhaitez disposer d’une base fiable avant la réunion. Est-ce une description exacte de l’enjeu ? »","checks":["Je reprends des éléments confirmés.","Je relie la situation à ses conséquences citées.","Je termine par une validation."]},{"scenario":"Un prospect doit produire une analyse mensuelle et veut étudier une solution « quand il aura le temps ».","prompt":"Prépare deux questions pour comprendre le calendrier réel et ce qui doit être prêt.","model":"« À quelle date l’analyse suivante doit-elle être finalisée ? » puis « Quelles informations seraient nécessaires pour décider avant cette date si une solution mérite d’être mise en place ? »","checks":["Je cherche l’échéance existante.","Je précise les éléments nécessaires à la décision.","Je n’invente pas d’urgence extérieure."]},{"scenario":"Le prospect indique qu’un problème ne produit pas de coût direct, mais retarde une décision commerciale.","prompt":"Formule une question qui rend l’effet décisionnel explicite.","model":"« Quelle décision est repoussée par ce retard et que pouvez-vous faire différemment lorsque l’information est disponible à temps ? »","checks":["Je n’exige pas une perte financière pour reconnaître un impact.","Je nomme la décision concernée.","Je recherche l’effet sur l’action."]},{"scenario":"Tu estimes que le statu quo peut générer 50 000 € de manque à gagner, sans données client permettant de l’étayer.","prompt":"Écris la réponse professionnelle à donner au lieu d’annoncer ce montant.","model":"« Je ne peux pas confirmer ce montant avec les informations actuelles. Nous pouvons examiner les volumes et les effets réels pour établir une estimation que vous pourrez vérifier. »","checks":["Je reconnais les limites des données.","Je propose une méthode de vérification.","Je ne présente pas une estimation spéculative comme un fait."]},{"scenario":"Le prospect précise qu’aucune décision importante n’est affectée par le problème.","prompt":"Que fais-tu ensuite pour savoir si le sujet mérite une action ?","model":"Clarifie ses priorités actuelles et ce qu’il attend de l’étude du sujet. S’il ne souhaite pas le traiter, intègre cette réponse au diagnostic et n’invente pas une conséquence.","checks":["Je respecte l’information fournie.","Je vérifie la priorité et l’action envisagée.","Je ne force pas une conclusion d’urgence."]},{"scenario":"Le prospect veut un résultat avant une période de forte activité.","prompt":"Écris les questions qui permettent de passer de cette échéance à une séquence de décision.","model":"« À quelle date la solution doit-elle être opérationnelle ? Quelles étapes sont nécessaires avant cette date ? Qui doit valider chacune d’elles ? »","checks":["Je précise la date d’effet attendue.","Je identifie les étapes de préparation.","Je clarifie les acteurs de décision."]},{"scenario":"Prépare un script oral de 25 secondes qui fait émerger l’impact de l’inaction.","prompt":"Réponds à partir du cas : reporting tardif avant comité, sans inventer de chiffres.","model":"« Aujourd’hui, les chiffres arrivent parfois après le comité. Pour comprendre l’impact réel, j’aimerais savoir quelles décisions deviennent plus difficiles dans ces cas-là. Ensuite, nous pourrons voir si une amélioration doit être priorisée et pour quelle échéance. »","checks":["Je pars de la situation confirmée.","Je questionne l’effet avant de conclure.","Je n’annonce pas de montant non vérifié."]}],"closing":[{"scenario":"Le prospect confirme que le bénéfice répond à sa priorité et qu’aucun point essentiel ne reste ouvert.","prompt":"Écris une conclusion directe adaptée à la situation.","model":"Formule une demande claire de décision sur la proposition. Une fois la question posée, arrête-toi et laisse le prospect répondre. La formulation doit être simple et cohérente avec les éléments validés pendant l’entretien.","checks":["La demande porte explicitement sur la décision.","Je n’ajoute pas de nouvel argument après la question.","Je laisse un silence réel."]},{"scenario":"Le prospect a validé le projet, mais doit choisir entre deux dates de démarrage réalistes.","prompt":"Formule une conclusion alternative.","model":"« Préférez-vous démarrer le 18 novembre ou le 2 décembre ? » Les dates doivent correspondre aux options effectivement disponibles et aux contraintes du prospect.","checks":["La décision d’achat est déjà suffisamment avancée.","Les options sont réalistes.","La question précise une modalité, pas un accord inexistant."]},{"scenario":"Le prospect reconnaît une difficulté mais n’a pas encore formulé le résultat souhaité.","prompt":"Rédige une conclusion sur le besoin, sans demander la commande.","model":"« Si je vous comprends bien, la difficulté principale est … et le résultat recherché est … Une solution qui répondrait à ces critères mériterait-elle d’être examinée ? »","checks":["Je reformule un besoin connu.","Je vérifie l’intérêt de le satisfaire.","Je n’avance pas prématurément à la commande."]},{"scenario":"Tu as envoyé une proposition. Le prospect dit : « Je vais en parler à mon directeur. »","prompt":"Transforme cette sortie en prochaine étape précise.","model":"Clarifie les éléments que le directeur doit examiner, le rôle de ton interlocuteur dans cette validation et la date de reprise après l’échange interne. Formule ensuite l’action, le responsable et le rendez-vous convenu.","checks":["Je ne traite pas cette phrase comme un accord.","Je précise les éléments nécessaires à la décision.","Je propose une date de reprise convenue."]},{"scenario":"Le client a validé le bénéfice, puis formule une réserve sur la mise en œuvre.","prompt":"Explique comment tu traites la réserve avant de conclure.","model":"Je demande ce qui, dans la mise en œuvre, soulève une réserve. Je traite le point précis et vérifie qu’il est résolu. Ensuite, je choisis la conclusion adaptée à la décision réellement prise.","checks":["Je ne considère pas la réserve comme levée.","Je clarifie avant de répondre.","Je reprends la conclusion après validation."]},{"scenario":"Le prospect veut faire valider le budget au comité du 12 novembre.","prompt":"Rédige un accord de prochaine étape avec action, responsable et date.","model":"« Je vous transmets le chiffrage détaillé jeudi. Vous le partagez au comité du 12 novembre. Nous reprenons le sujet le 13 novembre à 10 h pour examiner la décision et les éventuels points restants. Est-ce que cela correspond à votre calendrier ? »","checks":["L’action à préparer est précise.","Les rôles sont explicites.","La date de suivi suit l’événement de décision.","La proposition est confirmée par le prospect."]},{"scenario":"Le client a dit qu’il aimait l’approche mais n’a pas validé l’utilité d’un bénéfice présenté.","prompt":"Écris la conclusion intermédiaire appropriée.","model":"« Le bénéfice que je viens de décrire répond-il à la priorité que vous avez mentionnée, ou manque-t-il un élément ? »","checks":["Je valide un bénéfice précis.","Je ne présume pas de l’accord global.","J’ouvre la possibilité d’une correction."]},{"scenario":"Le prospect demande une option de configuration après avoir accepté le principe de la solution.","prompt":"Formule une alternative sur le choix d’exécution.","model":"Propose deux options de configuration réellement disponibles qui répondent aux critères exprimés, puis demande laquelle le prospect préfère. Ne formule l’alternative que si la décision d’achat est suffisamment avancée.","checks":["Les options sont réelles et pertinentes.","La question concerne une préférence d’exécution.","Je respecte le stade de décision."]},{"scenario":"Le prospect dit « Envoyez-moi un mail, on verra ».","prompt":"Écris une réponse qui clarifie ce qui doit se passer après l’envoi.","model":"« Quels éléments souhaitez-vous pouvoir examiner dans ce mail ? Une fois ces éléments étudiés, quand pouvons-nous reprendre ensemble la décision ? »","checks":["Je définis le contenu utile.","Je propose un rendez-vous de reprise.","Je ne confonds pas envoi et progression."]},{"scenario":"Le prospect formule une objection de prix juste après ta conclusion.","prompt":"Écris ton prochain mouvement.","model":"Reviens à l’objection : « Qu’est-ce qui vous paraît trop élevé au regard de ce que nous avons examiné ? » Fais préciser le critère avant de répondre, puis vérifie si le point est traité.","checks":["Je ne répète pas simplement la conclusion.","Je clarifie le motif de prix.","Je reprends le closing seulement après le traitement."]},{"scenario":"Le prospect a accepté les bénéfices et demande « Comment ferait-on pour démarrer ? »","prompt":"Quel type de conclusion peux-tu envisager et pourquoi ?","model":"Une alternative sur la date ou les modalités peut convenir, car la question porte sur la mise en œuvre. Choisis des options réelles et vérifie que la décision d’achat a bien été prise.","checks":["Je reconnais le signal de décision.","Je distingue décision d’achat et détails d’exécution.","Je formule un choix réaliste."]},{"scenario":"Enregistre oralement une conclusion adaptée à cette situation : le prospect valide les bénéfices, les objections sont traitées et les conditions sont connues.","prompt":"Formule une demande claire en une phrase, puis garde cinq secondes de silence.","model":"La réponse attendue est une demande de décision explicite, suivie du silence. Aucune justification supplémentaire ne doit être ajoutée avant que le prospect réponde.","checks":["La demande est audible et sans ambiguïté.","Je m’arrête après l’avoir formulée.","Je laisse cinq secondes sans remplir le silence."]}],"pressure":[{"scenario":"Prospect : « Vous ne m’écoutez pas. »","prompt":"Formule oralement une phrase réflexe puis laisse un silence pour écouter la suite.","model":"« Qu’est-ce que j’ai laissé de côté ou mal compris dans ce que vous venez de m’expliquer ? » Attends la réponse avant de te justifier ou de corriger la conversation.","checks":["Je formule une question de clarification.","Je ne contre-attaque pas.","Je laisse l’interlocuteur terminer."]},{"scenario":"Le prospect conteste sèchement le prix alors que tu présentais une fonctionnalité.","prompt":"Écris la première question, puis le mouvement suivant selon la réponse.","model":"Première étape : faire préciser le référentiel de « trop cher ». Deuxième étape : traiter la cause révélée (budget, comparaison, bénéfice attendu ou autre motif) avant d’argumenter.","checks":["Je ne donne pas de remise réflexe.","Je demande le référentiel.","Je prévois une suite qui dépend de la réponse."]},{"scenario":"Le prospect coupe ta phrase et dit : « C’est du bla-bla. »","prompt":"Prépare une réponse brève qui reprend la clarification et ramène l’entretien au sujet.","model":"« Quel point précis vous paraît non démontré ? Je vais reprendre ce point à partir des éléments que nous pouvons vérifier. »","checks":["Je demande le point précis.","Je ne débat pas sur le ton employé.","Je reviens à un élément vérifiable."]},{"scenario":"Tu poses une question sur les conséquences et le prospect réfléchit pendant plusieurs secondes.","prompt":"Enregistre une version où tu gardes huit secondes de silence sans remplir la pause.","model":"Le comportement à travailler est de poser la question puis d’attendre la réponse complète. Il ne s’agit pas de fournir les conséquences à la place du prospect.","checks":["Je ne complète pas la réponse à sa place.","Je tiens la pause complète.","Je reprends seulement après la réponse ou la fin claire de la pause."]},{"scenario":"Après une objection, tu as tendance à réciter trois fonctionnalités pour te rassurer.","prompt":"Écris une phrase réflexe qui te remet dans le diagnostic.","model":"« Pour vous répondre précisément, j’ai besoin de comprendre ce qui vous pose problème dans ce point. » Ensuite, fais préciser le critère avant de choisir l’argument.","checks":["La phrase vise la clarification.","Elle n’ajoute pas de fonctionnalité.","La réponse suivante dépend de l’information obtenue."]},{"scenario":"Le prospect hausse le ton et remet en cause la réputation de l’entreprise.","prompt":"Prépare une ouverture qui demande l’élément précis concerné.","model":"« Quelle image avez-vous de nous ? » ou « Puis-je vous demander quelles sont vos sources ? » Écoute la réponse avant de choisir les faits et arguments utiles.","checks":["Je demande une précision.","Je ne me justifie pas avant de connaître l’accusation exacte.","Je laisse le prospect répondre."]},{"scenario":"Même objection, quatrième fois : « Je ne vois toujours pas l’intérêt. »","prompt":"Écris une réponse de reprise, sans répéter la même formule.","model":"« Quel bénéfice présenté ne répond pas à votre priorité, ou quel élément manque pour que le lien soit clair ? » Puis reviens au besoin, au bénéfice ou à la preuve selon la réponse.","checks":["Je cherche ce qui manque encore.","Je ne répète pas la même réponse plus fort.","Je reprends l’étape qui n’est pas validée."]},{"scenario":"Le prospect interrompt pour une question spécifique, mais tu as préparé un pitch de cinq minutes.","prompt":"Écris une réponse qui traite d’abord sa question puis permet de reprendre.","model":"Réponds à la question précise en premier. Si une donnée manque, dis-le et clarifie ce qui est nécessaire. Vérifie ensuite si le prospect veut approfondir ce point ou reprendre la suite.","checks":["Je privilégie la question réellement posée.","Je signale clairement toute information manquante.","Je vérifie la suite avec le prospect."]},{"scenario":"Tu viens de formuler une conclusion directe et le prospect garde le silence.","prompt":"Décris précisément ce que tu fais pendant les cinq premières secondes.","model":"Tu ne rajoutes pas d’argument, ne proposes pas une remise et ne reformules pas la question. Tu laisses le prospect répondre de sa propre initiative.","checks":["Je garde le silence.","Je ne réponds pas à sa place.","Je laisse la demande exister sans la diluer."]},{"scenario":"Le prospect pose trois questions et tu réponds en partant dans plusieurs directions.","prompt":"Prépare une reprise qui clarifie la question prioritaire et structure ta réponse.","model":"« Vous avez soulevé trois points. Je vais commencer par le délai, puis traiter la qualité des données et enfin les modalités de déploiement. » Réponds à chaque point dans cet ordre et ferme chacun avant de passer au suivant.","checks":["Je structure l’ordre des sujets.","Je traite chaque question sans digression.","Je signale clairement les transitions."]},{"scenario":"Tu dois répondre à une objection inattendue. Tu n’as pas de formulation exacte en mémoire.","prompt":"Utilise le squelette de réflexe le plus robuste et explique les trois étapes.","model":"Écouter l’objection jusqu’au bout ; demander une précision ciblée sur ce qui bloque ; choisir la réponse après avoir compris le point. Les formulations exactes se préparent et se répètent pour les objections récurrentes.","checks":["Je n’invente pas une réponse avant le diagnostic.","Je pose une question précise.","Je sélectionne la suite après la réponse."]},{"scenario":"Enregistre la même réponse deux fois : prospect neutre, puis prospect qui t’interrompt.","prompt":"Réponds à la question : « Quel mouvement commercial devons-nous préserver même quand le ton change ? »","model":"Le mouvement choisi doit rester identique dans les deux prises : clarifier avant de répondre, maintenir le fil du besoin, présenter un bénéfice pertinent ou conclure puis garder le silence. Compare ce comportement, pas seulement le ressenti général.","checks":["Je choisis un comportement observable.","Je compare deux situations comparables.","Je note ce qui a disparu sous interruption."]}],"eloquence":[{"scenario":"Le dirigeant demande : « Que change votre solution pour mon équipe ? » Le contexte est un reporting consolidé tardivement.","prompt":"Écris une réponse orale de 20 à 30 secondes, sans tic verbal.","model":"« Les données sont regroupées dans un état commun. Votre équipe évite les rapprochements manuels et peut comparer les écarts avant le comité. Est-ce le résultat que vous cherchez en priorité ? »","checks":["L’idée principale arrive dans la première phrase.","Je relie capacité, usage et bénéfice.","Je termine par une question précise.","J’évite les mots de remplissage."]},{"scenario":"Ta réponse habituelle commence par « Du coup, en fait, voilà, l’idée c’est que… »","prompt":"Réécris l’ouverture pour commencer par le message principal.","model":"Supprime les amorces et nomme directement l’action ou le résultat. Exemple : « Les données sont consolidées avant la réunion. » Complète ensuite avec le bénéfice ou la condition nécessaire.","checks":["Je supprime les amorces répétitives.","La première phrase apporte une information.","Je conserve les nuances utiles."]},{"scenario":"Tu expliques une fonctionnalité avec beaucoup de mots techniques.","prompt":"Réécris-la pour un directeur financier qui veut comprendre l’effet sur la décision.","model":"Décris l’action de la fonction, puis ce qu’elle permet au directeur de faire dans son processus décisionnel. Remplace les termes techniques non nécessaires par des actions et résultats précis.","checks":["Je garde le sens technique nécessaire.","Je tradu is vers l’usage et la décision.","Je n’ajoute pas de bénéfice non démontré."]},{"scenario":"Tu réponds en 60 secondes à une question qui mérite 20 secondes.","prompt":"Réduis ta réponse à trois phrases : idée, bénéfice, validation.","model":"Phrase 1 : capacité ou idée principale. Phrase 2 : effet pour le prospect, lié au besoin exprimé. Phrase 3 : question de validation ou demande concrète. Retire les répétitions et les éléments qui ne servent pas la réponse.","checks":["Je respecte les trois fonctions des phrases.","Je retire les détails redondants.","Je garde l’information nécessaire."]},{"scenario":"Tu utilises « mieux », « plus performant » et « plus efficace » sans expliquer le résultat.","prompt":"Remplace ces mots par une formulation observable dans un contexte de pilotage commercial.","model":"Exemple : « Les responsables voient les opportunités sans activité depuis dix jours et peuvent prioriser les relances avant la revue hebdomadaire. »","checks":["Je remplace les adjectifs génériques par une action.","Le contexte est précis.","Le résultat est compréhensible sans interprétation."]},{"scenario":"Tu utilises « et tout ça » à la fin de plusieurs phrases.","prompt":"Réécris trois phrases en terminant chacune par une idée complète.","model":"Chaque phrase doit nommer l’objet réel : « comparer les résultats régionaux », « identifier les affaires sans activité », « préparer les arbitrages avant le comité ». Ne remplace pas une formule vague par une autre.","checks":["Chaque phrase a une fin explicite.","Je nomme les éléments concernés.","Je n’ajoute pas un tic équivalent."]},{"scenario":"Tu réponds par une longue liste de fonctions au lieu d’expliquer ce qui compte pour le client.","prompt":"Écris une réponse en CAB et arrête-toi après une question de validation.","model":"Part du besoin confirmé ; choisis une caractéristique ; explique l’avantage ; nomme le bénéfice ; vérifie sa pertinence. Écarte les fonctions qui ne participent pas au raisonnement.","checks":["Je sélectionne une caractéristique utile.","Je distingue avantage et bénéfice.","Je termine par une validation explicite."]},{"scenario":"En écoute, tu repères quatre amorces abandonnées et plusieurs « en fait ».","prompt":"Définis une règle de correction ciblée pour la prochaine prise.","model":"Cible d’abord les amorces : commencer avec l’idée principale. À la deuxième écoute, travaille uniquement « en fait » en le supprimant lorsqu’il ne joue aucun rôle sémantique. Compare la fréquence et la clarté.","checks":["Je cible une famille de comportements à la fois.","Je conserve une grille stable.","Je compare la prise suivante à la prise initiale."]},{"scenario":"Tu dois expliquer pourquoi tu ne peux pas encore annoncer un gain chiffré.","prompt":"Rédige une réponse claire et professionnelle.","model":"« Nous pouvons montrer quelles tâches sont supprimées ou réduites. Pour chiffrer le gain dans votre organisation, il nous faut mesurer le temps actuel et le volume concerné. »","checks":["Je distingue ce qui est connu de ce qui reste à mesurer.","Je formule la donnée manquante.","Je propose une étape concrète."]},{"scenario":"Ton raisonnement contient une idée principale, trois exemples et deux digressions.","prompt":"Réorganise la réponse en trois étapes logiques et dis ce que tu supprimes.","model":"Annonce le point principal, garde l’exemple qui l’étaye le mieux, puis formule la conséquence ou la demande. Supprime les exemples redondants et les digressions qui ne répondent pas à la question.","checks":["L’idée directrice est explicite.","Je garde une preuve utile.","Je termine le raisonnement."]},{"scenario":"Enregistre une réponse de 30 secondes, puis une seconde version.","prompt":"Utilise la grille pour comparer les deux versions.","model":"Évalue : clarté de la première phrase, nombre de tics audibles, précision du vocabulaire, reprises et digressions, lien avec le besoin, question finale. Choisis deux critères prioritaires et refais la prise.","checks":["Je note des observations spécifiques.","Je compare deux versions sur la même grille.","Je sélectionne deux corrections concrètes."]},{"scenario":"Un dirigeant demande une réponse en une phrase : « Pourquoi devrais-je m’intéresser à votre proposition ? »","prompt":"Écris une phrase adaptée au besoin confirmé, sans introduire de nouveau sujet.","model":"« Vous avez indiqué que [problème confirmé] complique [conséquence confirmée] ; notre approche permet de [capacité vérifiée] afin de [bénéfice lié au besoin]. » Remplis uniquement avec les faits connus du scénario.","checks":["La phrase part du besoin du client.","La capacité est vérifiable.","Le bénéfice correspond à une conséquence confirmée."]}]}};
const STORE='koldKallLearnV2';
const skillColors=['#6788ee','#9a88ef','#43b9a0','#d5a05a','#6489ee','#55b6c5','#d18b6a'];
let state={page:'overview',activeModule:null,lessonIndex:0,exercise:null,round:0,answers:{},shownModels:{},selectedTheme:'all',search:'',stateData:loadProgress(),recording:null,recorder:null,recordChunks:[],recordUrl:null,recordTimer:null,recordSeconds:0};
function loadProgress(){try{return JSON.parse(localStorage.getItem(STORE))||{lessons:{},exerciseDone:{},quizScores:{},practiceAnswers:{}}}catch(e){return {lessons:{},exerciseDone:{},quizScores:{},practiceAnswers:{}}}}
function saveProgress(){try{localStorage.setItem(STORE,JSON.stringify(state.stateData))}catch(e){} updateProgressBadges()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function moduleById(id){return DATA.modules.find(m=>m.id===id)}
function themeName(id){return moduleById(id)?.name||id}
function totalLessons(){return DATA.modules.reduce((n,m)=>n+m.lessons.length,0)}
function totalExercises(){return DATA.modules.length*4}
function lessonKey(mod,index){return mod+'_'+index}
function exerciseKey(mod,kind){return mod+'_'+kind}
function isLessonDone(mod,index){return !!state.stateData.lessons[lessonKey(mod,index)]}
function isExerciseDone(mod,kind){return !!state.stateData.exerciseDone[exerciseKey(mod,kind)]}
function doneLessonCount(){return Object.values(state.stateData.lessons).filter(Boolean).length}
function doneExerciseCount(){return Object.values(state.stateData.exerciseDone).filter(Boolean).length}
function updateProgressBadges(){const el=document.querySelector('[data-progress-inline]');if(el)el.textContent=doneLessonCount()+' / '+totalLessons()+' leçons'}
function notify(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(notify.timer);notify.timer=setTimeout(()=>t.classList.remove('show'),2300)}
function navigate(page){state.page=page;document.querySelectorAll('.top-link').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));const p=document.getElementById('page-'+page);if(p)p.classList.add('active');renderPage(page);window.scrollTo({top:0,behavior:'smooth'})}
function renderPage(page){if(page==='overview')renderOverview();if(page==='modules')renderModules();if(page==='exercises')renderExercises();if(page==='progress')renderProgress();if(page==='reader')renderReader();if(page==='exercise-run')renderExerciseRun()}
function head(eyebrow,title,desc,count=''){return `<div class="heading"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${desc}</p></div>${count?`<div class="quiet-count">${count}</div>`:''}</div>`}
function themeSkillCard(m,i,kind='modules'){return `<article class="skill-card glass" data-theme-action="${kind}" data-theme="${m.id}"><div class="skill-no" style="background:${i%3===0?'#edf2ff':i%3===1?'#f1edff':'#e8f8f2'};color:${skillColors[i]}">${String(i+1).padStart(2,'0')}</div><div><b>${esc(m.name)}</b><small>${esc(m.title)}</small></div></article>`}
function renderOverview(){
 const lessons=doneLessonCount(),exdone=doneExerciseCount(), pct=Math.round((lessons+exdone)/(totalLessons()+totalExercises())*100);
 document.getElementById('page-overview').innerHTML=`<div class="hero-grid"><section class="hero-card"><div class="eyebrow">Performance commerciale</div><h1>Apprendre pour <em>mieux vendre.</em></h1><p>Deux espaces distincts : approfondis les méthodes dans les modules, puis travaille-les dans la bibliothèque d’exercices. À toi de choisir ce que tu veux pratiquer.</p><div class="actions"><button class="btn primary" data-go="modules">Explorer les modules</button><button class="btn soft" data-go="exercises">Ouvrir les exercices</button></div></section><section class="mini-progress-card glass"><div><div class="mini-title">Ta progression</div><div class="big-progress">${pct}<small> %</small></div><div class="muted">${lessons} leçons terminées · ${exdone} séries d’exercices terminées</div><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div></div><button class="btn soft" data-go="progress" style="align-self:flex-start">Voir ma progression</button></section></div>
 <div class="library-grid"><article class="library-card glass"><div class="library-icon">▤</div><h2>Modules de formation</h2><p>42 chapitres répartis en 7 compétences. Des méthodes, des raisonnements détaillés et des exemples de vente à étudier à ton rythme.</p><div class="library-metrics">${totalLessons()} chapitres · ${lessons} terminés</div><button class="btn primary" data-go="modules">Consulter les modules</button></article><article class="library-card glass"><div class="library-icon" style="background:#e8f8f2;color:#38a58e">↗</div><h2>Bibliothèque d’exercices</h2><p>28 séries, chacune avec 6 situations. QCM corrigés, productions écrites et sprints oraux sur les mêmes compétences, dans un espace séparé.</p><div class="library-metrics">${totalExercises()} séries · ${exdone} terminées · 168 situations</div><button class="btn primary" data-go="exercises">Choisir un exercice</button></article></div>
 <div class="section-title"><h2>Les 7 compétences</h2><span>Choisis ton espace de travail en haut de l’écran</span></div><div class="skill-grid">${DATA.modules.map((m,i)=>themeSkillCard(m,i,'modules')).join('')}</div>`;
}
function renderModules(){const q=state.search.toLowerCase();const list=DATA.modules.filter(m=>(state.selectedTheme==='all'||state.selectedTheme===m.id)&&(!q||(m.name+' '+m.title+' '+m.summary+' '+m.lessons.map(l=>l.title).join(' ')).toLowerCase().includes(q)));
 document.getElementById('page-modules').innerHTML=head('Formation','Modules de formation','Explore les sept domaines de compétence, avec six chapitres développés par domaine.',`${totalLessons()} chapitres`)+`<div class="library-toolbar"><input class="search" id="moduleSearch" placeholder="Rechercher un module ou un chapitre…" value="${esc(state.search)}"><button class="filter-chip ${state.selectedTheme==='all'?'active':''}" data-module-filter="all">Tous</button>${DATA.modules.map(m=>`<button class="filter-chip ${state.selectedTheme===m.id?'active':''}" data-module-filter="${m.id}">${esc(m.name)}</button>`).join('')}</div><div class="item-grid">${list.map(m=>{let done=m.lessons.filter((l,i)=>isLessonDone(m.id,i)).length;return `<article class="item-card glass" data-open-module="${m.id}"><div class="item-card-top"><span class="pill">${m.lessons.length} chapitres</span><span class="pill mint">${done}/${m.lessons.length} lus</span></div><h3>${esc(m.title)}</h3><p>${esc(m.summary)}</p><div class="progress-track"><div class="progress-fill" style="width:${done/m.lessons.length*100}%"></div></div><div class="item-footer"><span>Formation</span><span class="item-status ${done===m.lessons.length?'done':''}"><i class="dot"></i>${done===m.lessons.length?'Terminé':'Ouvrir le module'} →</span></div></article>`}).join('')}</div>`;
}
function renderExercises(){const q=state.search.toLowerCase();const types=[['q1','Diagnostic'],['q2','Techniques'],['p1','Production écrite'],['p2','Sprint oral']];const list=DATA.modules.filter(m=>(state.selectedTheme==='all'||state.selectedTheme===m.id)&&(!q||(m.name+' '+m.title+' '+m.summary).toLowerCase().includes(q)));
 document.getElementById('page-exercises').innerHTML=head('Pratique','Bibliothèque d’exercices','28 séries indépendantes. Chaque série contient six situations, avec corrigé immédiat pour les QCM et grille d’auto-évaluation pour les productions.',`${totalExercises()} séries · 168 situations`)+`<div class="library-toolbar"><input class="search" id="exerciseSearch" placeholder="Rechercher par compétence…" value="${esc(state.search)}"><button class="filter-chip ${state.selectedTheme==='all'?'active':''}" data-exercise-filter="all">Tous</button>${DATA.modules.map(m=>`<button class="filter-chip ${state.selectedTheme===m.id?'active':''}" data-exercise-filter="${m.id}">${esc(m.name)}</button>`).join('')}</div>${list.map(m=>`<div class="section-title"><h2>${esc(m.name)}</h2><span>${esc(m.title)}</span></div><div class="item-grid">${types.map(([k,label])=>{let done=isExerciseDone(m.id,k);let desc=k==='q1'?'6 QCM : choisir le diagnostic utile.':k==='q2'?'6 QCM : sélectionner la méthode et le mouvement.':k==='p1'?'6 cas à résoudre à l’écrit, avec modèle et grille.':'6 mises en situation orales, avec enregistrement local facultatif.';return `<article class="item-card glass" data-start-exercise="${m.id}:${k}"><div class="item-card-top"><span class="pill ${k.startsWith('p')?'mint':''}">${label}</span><span class="pill">6 situations</span></div><h3>${label} · ${esc(m.name)}</h3><p>${desc}</p><div class="item-footer"><span>${done?'Série terminée':'Entraînement autonome'}</span><span class="item-status ${done?'done':''}"><i class="dot"></i>${done?'Rejouer':'Commencer'} →</span></div></article>`}).join('')}</div>`).join('')}`;
}
function renderReader(){const m=moduleById(state.activeModule);if(!m){navigate('modules');return}const lesson=m.lessons[state.lessonIndex];const count=m.lessons.filter((l,i)=>isLessonDone(m.id,i)).length;
 document.getElementById('page-reader').innerHTML=`<div class="reader-shell"><aside class="reader-list glass"><div class="reader-list-top"><b>${esc(m.name)}</b><span>${count}/${m.lessons.length} chapitres terminés</span><div class="progress-track"><div class="progress-fill" style="width:${count/m.lessons.length*100}%"></div></div></div><div class="reader-list-inner">${m.lessons.map((l,i)=>`<button class="lesson-select ${i===state.lessonIndex?'active':''}" data-lesson-index="${i}"><small>CHAPITRE ${String(i+1).padStart(2,'0')} ${isLessonDone(m.id,i)?'· ✓':''}</small><strong>${esc(l.title)}</strong></button>`).join('')}</div><button class="btn soft" data-go="modules" style="width:100%;margin-top:12px">← Tous les modules</button></aside><article class="reader glass"><div class="reader-nav"><span>MODULE · ${esc(m.name.toUpperCase())}</span><span>${state.lessonIndex+1} / ${m.lessons.length}</span></div><div class="eyebrow">Chapitre ${String(state.lessonIndex+1).padStart(2,'0')}</div><h1>${esc(lesson.title)}</h1><p class="reader-lead">${esc(lesson.lead)}</p>${lesson.sections.map(([title,body])=>`<section class="content-section"><h2>${esc(title)}</h2><p>${esc(body)}</p></section>`).join('')}<div class="example-box"><b>Exemple de mise en situation</b><p>${esc(lesson.example)}</p></div><div class="takeaway"><strong>À retenir. </strong>${esc(lesson.takeaway)}</div><div class="reader-controls"><button class="btn soft" data-lesson-prev ${state.lessonIndex===0?'disabled':''}>← Précédent</button><button class="btn ${isLessonDone(m.id,state.lessonIndex)?'soft':'primary'}" data-mark-lesson>${isLessonDone(m.id,state.lessonIndex)?'Chapitre terminé ✓':'Marquer comme lu'}</button><button class="btn primary" data-lesson-next>${state.lessonIndex===m.lessons.length-1?'Fin du module':'Chapitre suivant →'}</button></div></article></div>`;
}
